# Config para wokwi-cli / extensión de VS Code.
# Ajustar según cómo compiles el firmware:
#
# - PlatformIO (Arduino/ESP-IDF):
#     [wokwi]
#     version = 1
#     firmware = ".pio/build/esp32dev/firmware.bin"
#     elf = ".pio/build/esp32dev/firmware.elf"
#
# - ESP-IDF puro (idf.py build):
#     firmware = "build/<proyecto>.bin"
#     elf = "build/<proyecto>.elf"
#
# - ESPHome (esphome compile <archivo>.yaml):
#     El .bin queda en algo como .esphome/build/<nombre>/.pioenvs/<nombre>/firmware.bin
#     (variable según versión de ESPHome; buscar con:
#      find .esphome -name firmware.bin)

[wokwi]
version = 1
firmware = "firmware.bin"
elf = "firmware.elf"
